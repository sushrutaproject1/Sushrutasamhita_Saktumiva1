layout: default
---
<section class="page-hero">
  <div class="wrap article-wrap">
    <p class="kicker">{{ site.brand_label }} · {{ site.brand_sub }}</p>
    <h1>{{ page.title | default: site.title | escape }}</h1>
  </div>
</section>
<article class="wrap article-wrap">
  <div class="sheet prose">
    {{ content }}
  </div>
</article>
